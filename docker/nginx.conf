# nginx in de container. De nginx op de server regelt HTTPS en stuurt alles hierheen door.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;  # doorverwijzingen relatief houden, zodat ze op https blijven

    # www.alduslab.eu → alduslab.eu, zodat elk stuk één adres heeft.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    # Lettertypes, beeldmerk en iconen veranderen zelden: lang bewaren in de browser.
    location ~* \.(woff2|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
